  <script>
  (function () {
    var STORE = 'le-site-key';
    var payload = JSON.parse(document.getElementById('gate-payload').textContent);
    var form = document.getElementById('gate-form');
    var input = document.getElementById('gate-password');
    var button = document.getElementById('gate-submit');
    var errorEl = document.getElementById('gate-error');

    if (!payload) { document.getElementById('gate-404').classList.remove('hidden'); return; }

    function fromB64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
    function toB64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }

    async function decryptWithRaw(raw) {
      var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(payload.iv) }, key, fromB64(payload.data));
      return new TextDecoder().decode(plain);
    }

    function show(html) {
      // Replace the page only once the password screen has finished loading;
      // writing earlier would append to it instead of replacing it.
      function swap() { document.open(); document.write(html); document.close(); }
      if (document.readyState === 'complete') swap();
      else window.addEventListener('load', swap, { once: true });
    }

    async function tryStored() {
      try {
        var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
        if (saved && saved.salt === payload.salt) {
          show(await decryptWithRaw(fromB64(saved.key)));
          return true;
        }
      } catch (e) { localStorage.removeItem(STORE); }
      return false;
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorEl.textContent = '';
      button.disabled = true;
      button.textContent = 'Checking…';
      try {
        var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(input.value), 'PBKDF2', false, ['deriveBits']);
        var raw = await crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: fromB64(payload.salt), iterations: payload.iter, hash: 'SHA-256' }, base, 256);
        var html = await decryptWithRaw(raw);
        localStorage.setItem(STORE, JSON.stringify({ salt: payload.salt, key: toB64(raw) }));
        show(html);
      } catch (err) {
        errorEl.textContent = 'Incorrect password. Please try again.';
        button.disabled = false;
        button.textContent = 'Submit';
        input.select();
      }
    });

    tryStored().then(function (ok) {
      if (!ok) { form.classList.remove('hidden'); input.focus(); }
    });
  })();
  </script>
